version: "3.9"

services:
  client:
    build:
      context: ./client
    container_name: client-container
    restart: always
    environment:
      - VITE_API_BASE_URL=/api
    networks:
      - app-network

  server:
    build:
      context: ./server
    container_name: server-container
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:4.4
    container_name: mongodb-container
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-container
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - client
      - server
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
