services:
  client:
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=/api
        - VITE_API_BASE_URL=/api
    container_name: client-container
    restart: always
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network

  server:
    build:
      context: ./server
    container_name: server-container
    restart: always
    expose:
      - "8080"
    env_file:
      - ./server/.env
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-container
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - client
    networks:
      - app-network

networks:
  app-network:
