name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      ROOT_DIR: /home/njerka/actions-runner/_work/njrk.fit/njrk.fit
      SERVER_DIR: /home/njerka/actions-runner/_work/njrk.fit/njrk.fit/server
      CLIENT_DIR: /home/njerka/actions-runner/_work/njrk.fit/njrk.fit/client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Server .env
        run: |
          cat > "$SERVER_DIR/.env" << EOF

          PORT=${{ secrets.PORT }}
          NODE_ENV=${{ secrets.NODE_ENV }}
          
          CLIENT_URL=${{ secrets.CLIENT_URL }}
          API_URL=${{ secrets.API_URL }}

          OPEN_ROUTER_API_KEY=${{ secrets.OPEN_ROUTER_API_KEY }}
          OPEN_ROUTER_MODEL=${{ secrets.OPEN_ROUTER_MODEL }}

          RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}

          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}

          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}

          JWT_ADMIN_SECRET=${{ secrets.JWT_ADMIN_SECRET }}
          JWT_ADMIN_EXPIRATION=${{ secrets.JWT_ADMIN_EXPIRATION }}

          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}

          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}

          CLOUDINARY_NAME=${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}

          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}

          MONGODB_URI=${{ secrets.MONGODB_URI }}
          EOF

      - name: Generate Client .env
        run: |
          cat > "$CLIENT_DIR/.env.production" << EOF
          VITE_API_BASE_URL=${{ secrets.API_URL }}
          VITE_PRO_PLAN_PRICE_ID=${{ secrets.VITE_PRO_PLAN_PRICE_ID }}
          VITE_FAMILY_PLAN_PRICE_ID=${{ secrets.VITE_FAMILY_PLAN_PRICE_ID }}
          EOF

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Build Server
        working-directory: ./server
        run: npm run build

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Client
        working-directory: ./client
        run: npm run build

      - name: Start or Restart PM2
        run: |
          if pm2 describe njerka_server > /dev/null; then
            pm2 restart njerka_server
          else
            pm2 start "node $SERVER_DIR/dist/index.js" \
              --name njerka_server \
              --time
          fi

          pm2 save

      - name: Reload Nginx
        run: sudo systemctl reload nginx
